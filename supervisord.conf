[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[inet_http_server]
port=0.0.0.0:9006

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
nodaemon=true
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:01_ohm_live]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /root/user_ws/install/setup.bash && ros2 launch ohm_ros2 ohm_live.launch.py"
autostart=false
autorestart=false
startretries=0
stdout_logfile=/var/log/supervisor/ohm_live.log
stderr_logfile=/var/log/supervisor/ohm_live.log
stdout_logfile_maxbytes=5MB
environment=ROS_DOMAIN_ID="%(ENV_ROS_DOMAIN_ID)s",RMW_IMPLEMENTATION="%(ENV_RMW_IMPLEMENTATION)s",CYCLONEDDS_URI="%(ENV_CYCLONEDDS_URI)s"

[program:02_save_map]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /root/user_ws/install/setup.bash && ros2 service call /ohm/save std_srvs/srv/Trigger {}"
autostart=false
autorestart=false
startretries=0
exitcodes=0
stdout_logfile=/var/log/supervisor/save_map.log
stderr_logfile=/var/log/supervisor/save_map.log
stdout_logfile_maxbytes=1MB
environment=ROS_DOMAIN_ID="%(ENV_ROS_DOMAIN_ID)s",RMW_IMPLEMENTATION="%(ENV_RMW_IMPLEMENTATION)s",CYCLONEDDS_URI="%(ENV_CYCLONEDDS_URI)s"
