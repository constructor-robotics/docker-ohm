[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[inet_http_server]
port=0.0.0.0:9006

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://localhost:9006

; Live OHM occupancy/NDT-OM mapping.
; Subscribes to /depth_anything_v3/points + TF from OptiTrack.
; Publishes /ohm/occupied_cloud and provides /ohm/save service.
[program:01_ohm_live]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /root/user_ws/install/setup.bash && ros2 launch ohm_ros2 ohm_live.launch.py"
autostart=false
autorestart=false
stdout_logfile=/var/log/supervisor/ohm_live.log
stderr_logfile=/var/log/supervisor/ohm_live.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
